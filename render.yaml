services:
  - type: web
    name: federation-n8n
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: PORT
        value: "10000"
      - key: FEDERATION_MASTER_AUTH_CODE
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: VAULT_REPO
        value: "Keywebco/federation-private-vault"
